events { worker_connections 1024; }

http {
  upstream request_processor {
    server request-processor:3000;
  }

  server {
    listen 80;

    # Stream generated podcast MP3s directly from the shared volume.
    # Access: GET /audio/<uuid>.mp3
    location /audio/ {
      alias        /podcasts/;
      types        { audio/mpeg mp3; }
      add_header   Accept-Ranges bytes;
      add_header   Cache-Control "no-cache";
      add_header   Access-Control-Allow-Origin *;
    }

    # All other traffic (API + WebSocket) proxied to Request Processor.
    location / {
      proxy_pass         http://request_processor;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_read_timeout 86400;
    }
  }
}
