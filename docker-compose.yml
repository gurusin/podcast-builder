version: "3.9"

services:
  # ── Kafka (KRaft mode — no ZooKeeper) ──────────────────────────────────────
  kafka:
    image: bitnami/kafka:3.6.2
    container_name: podcast-kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_LOG_RETENTION_HOURS: 168
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - kafka_data:/bitnami/kafka

  # ── MongoDB (lightweight NoSQL) ─────────────────────────────────────────────
  mongo:
    image: mongo:7-jammy
    container_name: podcast-mongo
    environment:
      MONGO_INITDB_DATABASE: podcast-system
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mongo_data:/data/db

  # ── Request Processor ───────────────────────────────────────────────────────
  request-processor:
    build:
      context: ./services/request-processor
      dockerfile: Dockerfile
    container_name: podcast-request-processor
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      KAFKA_BROKER: kafka:9092
      MONGODB_URI: mongodb://mongo:27017/podcast-system
      NODE_ENV: production
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # ── Content Crawler ─────────────────────────────────────────────────────────
  content-crawler:
    build:
      context: ./services/content-crawler
      dockerfile: Dockerfile
    container_name: podcast-content-crawler
    environment:
      KAFKA_BROKER: kafka:9092
      MONGODB_URI: mongodb://mongo:27017/podcast-system
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # ── Generator ───────────────────────────────────────────────────────────────
  generator:
    build:
      context: ./services/generator
      dockerfile: Dockerfile
    container_name: podcast-generator
    environment:
      KAFKA_BROKER: kafka:9092
      MONGODB_URI: mongodb://mongo:27017/podcast-system
      PODCASTS_DIR: /app/podcasts
    volumes:
      - ./podcasts:/app/podcasts
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # ── Nginx (API Gateway) ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: podcast-nginx
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - request-processor
    restart: unless-stopped

volumes:
  kafka_data:
  mongo_data:
