version: "3.9"

services:
  # ── Kafka (KRaft mode — no ZooKeeper) ──────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: podcast-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ── MongoDB (lightweight NoSQL) ─────────────────────────────────────────────
  mongo:
    image: mongo:7-jammy
    container_name: podcast-mongo
    environment:
      MONGO_INITDB_DATABASE: podcast-system
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - mongo_data:/data/db

  # ── Request Processor ───────────────────────────────────────────────────────
  request-processor:
    build:
      context: ./services/request-processor
      dockerfile: Dockerfile
    container_name: podcast-request-processor
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      KAFKA_BROKER: kafka:9092
      MONGODB_URI: mongodb://mongo:27017/podcast-system
      NODE_ENV: production
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # ── Content Crawler ─────────────────────────────────────────────────────────
  content-crawler:
    build:
      context: ./services/content-crawler
      dockerfile: Dockerfile
    container_name: podcast-content-crawler
    environment:
      KAFKA_BROKER: kafka:9092
      MONGODB_URI: mongodb://mongo:27017/podcast-system
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # ── Generator ───────────────────────────────────────────────────────────────
  generator:
    build:
      context: ./services/generator
      dockerfile: Dockerfile
    container_name: podcast-generator
    environment:
      KAFKA_BROKER: kafka:9092
      MONGODB_URI: mongodb://mongo:27017/podcast-system
      PODCASTS_DIR: /app/podcasts
    volumes:
      - ./podcasts:/app/podcasts
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # ── Nginx (API Gateway) ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: podcast-nginx
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./podcasts:/podcasts:ro
    depends_on:
      - request-processor
    restart: unless-stopped

volumes:
  kafka_data:
  mongo_data:
