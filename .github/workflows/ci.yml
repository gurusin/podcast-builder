name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-request-processor:
    name: Request Processor Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/request-processor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/request-processor/package-lock.json
      - run: npm ci
      - run: npm test -- --coverage --coverageThreshold='{"global":{"branches":80,"functions":80,"lines":80,"statements":80}}'

  test-content-crawler:
    name: Content Crawler Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/content-crawler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest --cov=src --cov-report=term-missing --cov-fail-under=80

  test-generator:
    name: Generator Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest --cov=src --cov-report=term-missing --cov-fail-under=80
